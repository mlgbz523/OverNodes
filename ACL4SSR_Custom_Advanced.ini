[custom]
; ============================================================
; Mihomo / Clash 经典高辨识度进阶订阅转换规则 (移动/桌面全场景通行纯净版)
; 特性：经典常用分类全量归位 + Agent超低延迟 + Gemini哈希防封 + 媒体分片直出 + 零直连投毒
; ============================================================

; 去广告：支持
; 自动测速：支持 (300s / 180s 双轨测速)
; 苹果分流：支持 (官方直连)
; 微软分流：支持 (精简直连)
; 增强中国IP段：支持
; 移动端哪都通：支持 (Google Play / Gemini / GMS 深度加固)
; 游戏与流媒体加速：支持 (Steam 429 频控免疫 + YouTube 4K 直出分流)

; ------------------------------------------------------------
; 1. 策略组定义 (custom_proxy_group)
; 格式：组名`类型`[引用成员/前置策略]`匹配正则`[测速URL]`[间隔,容差,超时]
; ------------------------------------------------------------

; ① 主入口控制组 (纯净底层线路调度，绝不掺杂业务分流组，根治层级倒挂与环路)
custom_proxy_group=🚀 节点选择`select`[]⚡ 自动优选`[]🤖 Agent 专线`[]🤖 Gemini 专项`[]🏛️ 特种直出专线`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇩🇪 德国节点`[]♻️ 负载均衡`[]🔯 故障转移`[]🌐 手动切换`[]DIRECT

; ② 自动测速组 (核心捕获所有链式节点，保证公网出口稳定不跳IP，100% 杜绝直出劣币逐良币)
custom_proxy_group=⚡ 自动优选`url-test`(?i).*(socks5|链式).*`http://cp.cloudflare.com/generate_204`300,50,50

; ③ 核心专线双子星：Agent 极速专线 + Gemini 一致性哈希专项
custom_proxy_group=🤖 Agent 专线`url-test`[]⚡ 自动优选`(?i).*(🇸🇬|新加坡|SG|SIN|Singapore|🇺🇸|美国|US|USA|美西|美东|洛杉矶|旧金山|芝加哥|达拉斯|纽约|迈阿密|西雅图|休斯顿|圣何塞).*(socks5|链式).*`http://cp.cloudflare.com/generate_204`180,30,30
custom_proxy_group=🤖 Gemini 专项`load-balance`(?i).*(🇺🇸|美国|US|USA|美西|美东|洛杉矶|旧金山|芝加哥|达拉斯|纽约|迈阿密|西雅图|休斯顿|圣何塞|🇸🇬|新加坡|SG|SIN|Singapore).*(socks5|链式).*`http://cp.cloudflare.com/generate_204`300,,consistent-hashing

; ④ 经典常用业务分流组 (名正言顺，经典图标与标准命名，层级自顶向下单向解耦)
custom_proxy_group=📥 下载专线`select`[]🏛️ 特种直出专线`[]⚡ 自动优选`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]DIRECT
custom_proxy_group=🎥 国外媒体`select`[]⚡ 自动优选`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇩🇪 德国节点`[]🚀 节点选择`[]DIRECT
custom_proxy_group=🛑 社交软件`select`[]⚡ 自动优选`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🚀 节点选择`[]DIRECT
custom_proxy_group=🐙 GitHub 服务`select`[]⚡ 自动优选`[]🇺🇸 美国节点`[]🇸🇬 新加坡节点`[]DIRECT

; ⑤ 特种业务独立加速组
; Steam 服务：默认首选特种直出专线，破 429 频控与登录转圈，次选自动优选
custom_proxy_group=🎮 Steam 服务`select`[]🏛️ 特种直出专线`[]⚡ 自动优选`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]DIRECT
; 特种直出专线：Cloudflare 原生纯净出口，专供 4K 视频数据流、网盘分片与特种豁免
custom_proxy_group=🏛️ 特种直出专线`url-test`(?i).*(直出|纯净).*`http://cp.cloudflare.com/generate_204`300,50,50
; 甲骨文服务：默认首选特种直出专线，破 Akamai WAF 验证
custom_proxy_group=🏛️ 甲骨文服务`select`[]🏛️ 特种直出专线`[]⚡ 自动优选`[]🚀 节点选择`[]DIRECT

; ⑥ 地区节点组 (前后正则完全兼容，前置挂载自动优选防 DIRECT 穿透)
custom_proxy_group=🇸🇬 新加坡节点`url-test`[]⚡ 自动优选`(?i).*(🇸🇬|新加坡|SG|SIN|Singapore).*(socks5|链式).*`http://cp.cloudflare.com/generate_204`300,50,50
custom_proxy_group=🇺🇸 美国节点`url-test`[]⚡ 自动优选`(?i).*(🇺🇸|美国|US|USA|美西|美东|洛杉矶|旧金山|芝加哥|达拉斯|纽约|迈阿密|西雅图|休斯顿|圣何塞).*(socks5|链式).*`http://cp.cloudflare.com/generate_204`300,50,50
custom_proxy_group=🇩🇪 德国节点`url-test`[]⚡ 自动优选`(?i).*(🇩🇪|德国|DE|法兰克福|Frankfurt|Berlin|Munich|München|Düsseldorf).*`http://cp.cloudflare.com/generate_204`300,50,50

; ⑦ 容灾备用与经典基础控制组 (全面还原经典图标与命名)
custom_proxy_group=♻️ 负载均衡`load-balance`(?i).*(socks5|链式).*`http://cp.cloudflare.com/generate_204`300,,consistent-hashing
custom_proxy_group=🔯 故障转移`fallback`(?i).*(socks5|链式).*`http://cp.cloudflare.com/generate_204`300
custom_proxy_group=🌐 手动切换`select`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]⚡ 自动优选`[]🎯 全球直连

; ------------------------------------------------------------
; 2. 规则集定义 (ruleset)
; 遵循自上而下匹配：局域网放行 -> 特种业务专线 -> 广告拦截 -> AI双专线 -> 谷歌生态 -> 常用海外分流 -> 国内直连 -> 漏网之鱼
; ------------------------------------------------------------

; ① 局域网纯净放行 (★生死线：严禁引入含毒的 UnBan.list，避免把 Google 域名强行打入直连)
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list

; ② 🏛️ 甲骨文服务专属分流
ruleset=🏛️ 甲骨文服务,[]DOMAIN-SUFFIX,oracle.com
ruleset=🏛️ 甲骨文服务,[]DOMAIN-SUFFIX,oraclecloud.com
ruleset=🏛️ 甲骨文服务,[]DOMAIN-SUFFIX,oraclecloud.net
ruleset=🏛️ 甲骨文服务,[]DOMAIN-SUFFIX,oraclefoundation.org
ruleset=🏛️ 甲骨文服务,[]DOMAIN-KEYWORD,oracle

; ③ 🎮 Steam 核心登录鉴权、社区与商店全景接管 (彻底解决商店-118与登录二维码转圈)
ruleset=🎮 Steam 服务,[]DOMAIN,login.steampowered.com
ruleset=🎮 Steam 服务,[]DOMAIN,api.steampowered.com
ruleset=🎮 Steam 服务,[]DOMAIN-SUFFIX,login.steampowered.com
ruleset=🎮 Steam 服务,[]DOMAIN-SUFFIX,api.steampowered.com
ruleset=🎮 Steam 服务,[]DOMAIN-SUFFIX,steamcommunity.com
ruleset=🎮 Steam 服务,[]DOMAIN-SUFFIX,steam-chat.com
ruleset=🎮 Steam 服务,[]DOMAIN-SUFFIX,steamstatic.com
ruleset=🎮 Steam 服务,[]DOMAIN-SUFFIX,store.steampowered.com
ruleset=🎮 Steam 服务,[]DOMAIN-SUFFIX,steamuserimages-a.akamaihd.net
ruleset=🎮 Steam 服务,[]DOMAIN-SUFFIX,steamcommunity-a.akamaihd.net
ruleset=🎮 Steam 服务,[]DOMAIN-SUFFIX,steambroadcast.akamaized.net
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,steamcontent.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,steamserver.net

; ④ 📥 境外网盘与大文件加速专线 (特种直出专线加持，多线程满速下载)
ruleset=📥 下载专线,[]DOMAIN-SUFFIX,gofile.io
ruleset=📥 下载专线,[]DOMAIN-SUFFIX,mega.nz
ruleset=📥 下载专线,[]DOMAIN-SUFFIX,mediafire.com
ruleset=📥 下载专线,[]DOMAIN-SUFFIX,pixeldrain.com

; ⑤ 🎥 核心媒体流大带宽直出加速 (99% YouTube/Twitch 4K 视频数据流走 Cloudflare 千兆直出)
ruleset=🏛️ 特种直出专线,[]DOMAIN-SUFFIX,googlevideo.com
ruleset=🏛️ 特种直出专线,[]DOMAIN-SUFFIX,ttvnw.net
ruleset=🏛️ 特种直出专线,[]DOMAIN-SUFFIX,jtvnw.net
ruleset=🏛️ 特种直出专线,[]DOMAIN-SUFFIX,hembed.com
ruleset=🏛️ 特种直出专线,[]DOMAIN-SUFFIX,vdownload.hembed.com
ruleset=🎥 国外媒体,[]DOMAIN-SUFFIX,googletagmanager.com
ruleset=⚡ 自动优选,[]DOMAIN-SUFFIX,ooklaserver.net
ruleset=⚡ 自动优选,[]DOMAIN-KEYWORD,speedtest

; ⑥ 广告拦截与应用净化
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyListChina.list

; ⑦ 🤖 Agent 极速专线规则 (专为 IDE/Cursor/Antigravity 编码设计，180s 极速心跳)
ruleset=🤖 Agent 专线,[]DOMAIN-SUFFIX,googleapis.com
ruleset=🤖 Agent 专线,[]DOMAIN-SUFFIX,googleusercontent.com
ruleset=🤖 Agent 专线,[]DOMAIN,antigravity-unleash.goog
ruleset=🤖 Agent 专线,[]DOMAIN-SUFFIX,run.app
ruleset=🤖 Agent 专线,[]DOMAIN,browser.events.data.microsoft.com
ruleset=🤖 Agent 专线,[]DOMAIN,open-vsx.org

; ⑧ 🤖 Gemini 专项规则 (一致性哈希锁区防跳，全域支持 OpenAI 与 Gemini)
ruleset=🤖 Gemini 专项,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Gemini.list
ruleset=🤖 Gemini 专项,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list

; ⑨ 🌐 Google 完整生态加固 (彻底根治 Google Play 0速度与 GMS 推送断流)
ruleset=⚡ 自动优选,[]DOMAIN,dl.google.com
ruleset=⚡ 自动优选,[]DOMAIN,dl.l.google.com
ruleset=⚡ 自动优选,[]DOMAIN,mtalk.google.com
ruleset=⚡ 自动优选,[]DOMAIN-SUFFIX,gvt1.com
ruleset=⚡ 自动优选,[]DOMAIN-SUFFIX,1e100.net
ruleset=⚡ 自动优选,[]DOMAIN-SUFFIX,google.com
ruleset=⚡ 自动优选,[]DOMAIN-SUFFIX,android.com
ruleset=⚡ 自动优选,[]DOMAIN-SUFFIX,onedrive.live.com
ruleset=⚡ 自动优选,[]DOMAIN-SUFFIX,livefilestore.com
ruleset=⚡ 自动优选,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Google.list

; ⑩ 常用海外专项服务 (GitHub 与 Telegram)
ruleset=🐙 GitHub 服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Github.list
ruleset=🐙 GitHub 服务,[]DOMAIN-SUFFIX,githubusercontent.com
ruleset=🛑 社交软件,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Telegram.list

; ⑪ 🎥 国外媒体 网页与控制面 (走稳定 SOCKS5 解决防风控与人机验证)
ruleset=🎥 国外媒体,[]DOMAIN-SUFFIX,rule34video.com
ruleset=🎥 国外媒体,[]DOMAIN-SUFFIX,hanime1.me
ruleset=🎥 国外媒体,[]DOMAIN-SUFFIX,twitch.tv
ruleset=🎥 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🎥 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/ProxyMedia.list

; ⑫ 系统级与海外下载加速
ruleset=⚡ 自动优选,[]DOMAIN-KEYWORD,release
ruleset=📥 下载专线,[]DOMAIN-KEYWORD,download
ruleset=📥 下载专线,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list

; ⑬ 苹果与微软服务分流 (仅保留纯正不阻断的 Apple 直连，剔除易被墙的 OneDrive 直连)
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list

; ⑭ 纯正中国服务白名单与 IP 兜底 (彻底剔除含毒的 GoogleCN.list，实现零直连污染)
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIp.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; ------------------------------------------------------------
; 3. Subconverter 核心控制开关
; ------------------------------------------------------------
enable_rule_generator=true
overwrite_original_rules=true
