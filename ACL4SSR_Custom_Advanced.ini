[custom]
;; ===================================================================
;;  OverNode 定制化分流规则集 (CF 直连 × SOCKS5 三国落地 双轨分组)
;;
;;  节点分组逻辑：
;;    🚀 节点选择    - 总入口，可手动选择下级组
;;    ⚡ 自动选择    - 全部 S5 链式节点自动测速择优
;;    🔗 CF 直连     - 纯 Cloudflare 优选 IP 直连（SG/US/DE 等）
;;    🛰️ SOCKS5 节点 - 全部 SOCKS5 链式中继节点（仅保留美/新/港）
;;    🇺🇸 美国 S5    - 落地美国的 SOCKS5 链式节点 (AI 业务首选)
;;    🇭🇰 香港 S5    - 落地香港的 SOCKS5 链式节点 (低延迟亚太出口)
;;    🇸🇬 新加坡 S5  - 落地新加坡的 SOCKS5 链式节点 (稳定东南亚出口)
;; ===================================================================

;; ======================== 代理组定义 ========================

;; 1. 总入口：手动从下级组中选择
custom_proxy_group=🚀 节点选择`select`[]⚡ 自动选择`[]🔗 CF 直连`[]🛰️ SOCKS5 节点`[]🤖 AI 专线`[]🇺🇸 美国 S5`[]🇭🇰 香港 S5`[]🇸🇬 新加坡 S5`[]⚖️ 负载均衡`[]🛡️ 故障转移`[]🎛️ 手动切换`[]DIRECT

;; 2. 自动选择：匹配全部 S5 链式节点自动测速
custom_proxy_group=⚡ 自动选择`url-test`(?i).*S5.*`http://cp.cloudflare.com/generate_204`300,50,50

;; 3. CF 直连组：匹配所有包含"直连"关键词的节点
custom_proxy_group=🔗 CF 直连`url-test`(?i).*(直连|纯净).*`http://cp.cloudflare.com/generate_204`300,50,50

;; 4. SOCKS5 总组：匹配所有 S5 链式节点
custom_proxy_group=🛰️ SOCKS5 节点`select`(?i).*S5.*

;; 5. AI 专线：优先使用美国 S5，回退到自动选择
custom_proxy_group=🤖 AI 专线`select`[]🇺🇸 美国 S5`[]🇸🇬 新加坡 S5`[]🇭🇰 香港 S5`[]⚡ 自动选择`[]🔗 CF 直连`[]DIRECT

;; 6. 国外媒体：直连优先（大带宽），回退到 S5
custom_proxy_group=🎬 国外媒体`select`[]🔗 CF 直连`[]🇭🇰 香港 S5`[]🇸🇬 新加坡 S5`[]🇺🇸 美国 S5`[]🛰️ SOCKS5 节点`[]DIRECT

;; 7. 网盘下载：直连优先
custom_proxy_group=📥 网盘下载`select`[]🔗 CF 直连`[]DIRECT

;; 8. 社交软件
custom_proxy_group=💬 社交软件`select`[]🔗 CF 直连`[]🇭🇰 香港 S5`[]🇸🇬 新加坡 S5`[]🇺🇸 美国 S5`[]🛰️ SOCKS5 节点`[]DIRECT

;; 9. GitHub
custom_proxy_group=🐙 GitHub`select`[]🔗 CF 直连`[]🇺🇸 美国 S5`[]🇸🇬 新加坡 S5`[]🇭🇰 香港 S5`[]🛰️ SOCKS5 节点`[]DIRECT

;; 10. Steam
custom_proxy_group=🎮 Steam 服务`select`[]🔗 CF 直连`[]🇭🇰 香港 S5`[]🇸🇬 新加坡 S5`[]🇺🇸 美国 S5`[]DIRECT

;; 11. 甲骨文
custom_proxy_group=🏛️ 甲骨文服务`select`[]🔗 CF 直连`[]DIRECT

;; ---- SOCKS5 按落地国家子组 (严格限定：美国、香港、新加坡) ----

;; 美国 S5 落地组
custom_proxy_group=🇺🇸 美国 S5`select`(?i).*(US.*S5|US-S5|美国.*S5).*

;; 香港 S5 落地组
custom_proxy_group=🇭🇰 香港 S5`select`(?i).*(HK.*S5|HK-S5|香港.*S5).*

;; 新加坡 S5 落地组
custom_proxy_group=🇸🇬 新加坡 S5`select`(?i).*(SG.*S5|SG-S5|狮城.*S5|新加坡.*S5).*

;; ---- 通用辅助组 ----

;; 负载均衡：全部 S5 + 直连节点
custom_proxy_group=⚖️ 负载均衡`load-balance`(?i).*(S5|直连).*`http://cp.cloudflare.com/generate_204`300,,consistent-hashing

;; 故障转移
custom_proxy_group=🛡️ 故障转移`fallback`(?i).*(S5|直连).*`http://cp.cloudflare.com/generate_204`300

;; 手动切换：所有节点
custom_proxy_group=🎛️ 手动切换`select`.*

;; 全球直连
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择

;; 全球拦截
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT

;; 漏网之鱼
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]⚡ 自动选择`[]🎯 全球直连


;; ======================== 分流规则集 ========================

