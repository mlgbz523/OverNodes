[custom]
; ============================================================
; Mihomo / Clash 高辨识度全功能订阅转换规则 (移动端全生态通行纯净版)
; 特性：辨识度符号图标 + 彻底切除直连投毒 + Google/GMS全域解封 + Steam/网盘直出
; ============================================================

; 去广告：支持
; 自动测速：支持 (300s 间隔)
; 苹果分流：支持 (官方直连)
; 微软分流：支持 (部分直连)
; 增强中国IP段：支持
; 移动端哪都通：支持 (Google Play / Gemini / GMS 深度加固)

; ------------------------------------------------------------
; 1. 策略组定义 (custom_proxy_group)
; 格式：组名`类型`[引用成员/前置策略]`匹配正则`[测速URL]`[间隔,容差,超时]
; ------------------------------------------------------------

; ① 主入口控制组
custom_proxy_group=🚀 节点选择`select`[]⚡ 自动选择`[]🤖 AI 专线`[]🎮 Steam 服务`[]📥 网盘下载`[]🎬 国外媒体`[]💬 社交软件`[]🐙 GitHub`[]🏛️ 甲骨文服务`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇩🇪 德国节点`[]🔗 直连节点`[]⚖️ 负载均衡`[]🛡️ 故障转移`[]🎛️ 手动切换`[]DIRECT

; ② 自动测速组 (核心捕获所有链式节点，保证公网出口稳定不跳IP)
custom_proxy_group=⚡ 自动选择`url-test`(?i).*(socks5|链式).*`http://cp.cloudflare.com/generate_204`300,50,50

; ③ AI 专线 (合并 Agent 与 Gemini 专项，锁定美/新高质量链式节点)
custom_proxy_group=🤖 AI 专线`url-test`[]⚡ 自动选择`(?i).*(🇸🇬|新加坡|SG|SIN|Singapore|🇺🇸|美国|US|USA|美西|美东|洛杉矶|旧金山|芝加哥|达拉斯|纽约|迈阿密|西雅图|休斯顿|圣何塞).*(socks5|链式).*`http://cp.cloudflare.com/generate_204`300,50,50

; ④ 业务分流组 (单向树形解耦，杜绝成环)
custom_proxy_group=📥 网盘下载`select`[]🔗 直连节点`[]DIRECT
custom_proxy_group=🎬 国外媒体`select`[]⚡ 自动选择`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇩🇪 德国节点`[]DIRECT
custom_proxy_group=💬 社交软件`select`[]⚡ 自动选择`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]DIRECT
custom_proxy_group=🐙 GitHub`select`[]⚡ 自动选择`[]🇺🇸 美国节点`[]🇸🇬 新加坡节点`[]DIRECT

; Steam 服务：★生死线配置，默认第一位必须是直连节点，保证登录鉴权与市场秒开
custom_proxy_group=🎮 Steam 服务`select`[]🔗 直连节点`[]⚡ 自动选择`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]DIRECT

; 直连节点：仅保留精简后的官方直连节点，原生纯净出口
custom_proxy_group=🔗 直连节点`url-test`(?i).*(直出|纯净).*`http://cp.cloudflare.com/generate_204`300,50,50

; 甲骨文服务：优先走直连节点
custom_proxy_group=🏛️ 甲骨文服务`select`[]🔗 直连节点`[]⚡ 自动选择`[]🇺🇸 美国节点`[]DIRECT

; ⑤ 地区节点组
custom_proxy_group=🇸🇬 新加坡节点`url-test`[]⚡ 自动选择`(?i).*(🇸🇬|新加坡|SG|SIN|Singapore).*(socks5|链式).*`http://cp.cloudflare.com/generate_204`300,50,50
custom_proxy_group=🇺🇸 美国节点`url-test`[]⚡ 自动选择`(?i).*(🇺🇸|美国|US|USA|美西|美东|洛杉矶|旧金山|芝加哥|达拉斯|纽约|迈阿密|西雅图|休斯顿|圣何塞).*(socks5|链式).*`http://cp.cloudflare.com/generate_204`300,50,50
custom_proxy_group=🇩🇪 德国节点`url-test`[]⚡ 自动选择`(?i).*(🇩🇪|德国|DE|法兰克福|Frankfurt|Berlin|Munich|München|Düsseldorf).*`http://cp.cloudflare.com/generate_204`300,50,50

; ⑥ 容灾备用与基础控制
custom_proxy_group=⚖️ 负载均衡`load-balance`(?i).*(socks5|链式).*`http://cp.cloudflare.com/generate_204`300,,consistent-hashing
custom_proxy_group=🛡️ 故障转移`fallback`(?i).*(socks5|链式).*`http://cp.cloudflare.com/generate_204`300
custom_proxy_group=🎛️ 手动切换`select`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]⚡ 自动选择`[]🎯 全球直连

; ------------------------------------------------------------
; 2. 规则集定义 (ruleset)
; 遵循自上而下匹配：局域网白名单 -> 业务专线 -> 广告拦截 -> AI/Google/海外 -> 纯正国内直连 -> 漏网之鱼
; ------------------------------------------------------------

; ① 局域网纯净放行 (彻底移除含毒的 UnBan.list)
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list

; 🏛️ 甲骨文服务专属分流
ruleset=🏛️ 甲骨文服务,[]DOMAIN-SUFFIX,oracle.com
ruleset=🏛️ 甲骨文服务,[]DOMAIN-SUFFIX,oraclecloud.com
ruleset=🏛️ 甲骨文服务,[]DOMAIN-SUFFIX,oraclecloud.net
ruleset=🏛️ 甲骨文服务,[]DOMAIN-SUFFIX,oraclefoundation.org
ruleset=🏛️ 甲骨文服务,[]DOMAIN-KEYWORD,oracle

; 🎮 Steam 核心登录鉴权与社区/商店全景接管 (彻底修复 store.steampowered.com 直连-118报错)
ruleset=🎮 Steam 服务,[]DOMAIN,login.steampowered.com
ruleset=🎮 Steam 服务,[]DOMAIN,api.steampowered.com
ruleset=🎮 Steam 服务,[]DOMAIN-SUFFIX,login.steampowered.com
ruleset=🎮 Steam 服务,[]DOMAIN-SUFFIX,api.steampowered.com
ruleset=🎮 Steam 服务,[]DOMAIN-SUFFIX,steamcommunity.com
ruleset=🎮 Steam 服务,[]DOMAIN-SUFFIX,steam-chat.com
ruleset=🎮 Steam 服务,[]DOMAIN-SUFFIX,steamstatic.com
ruleset=🎮 Steam 服务,[]DOMAIN-SUFFIX,store.steampowered.com
ruleset=🎮 Steam 服务,[]DOMAIN-SUFFIX,steamuserimages-a.akamaihd.net
ruleset=🎮 Steam 服务,[]DOMAIN-SUFFIX,steamcommunity-a.akamaihd.net
ruleset=🎮 Steam 服务,[]DOMAIN-SUFFIX,steambroadcast.akamaized.net
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,steamcontent.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,steamserver.net

; 📥 网盘与大文件加速 (纯净直出节点独占，杜绝跳IP分片损坏)
ruleset=📥 网盘下载,[]DOMAIN-SUFFIX,gofile.io
ruleset=📥 网盘下载,[]DOMAIN-SUFFIX,mega.nz
ruleset=📥 网盘下载,[]DOMAIN-SUFFIX,mediafire.com
ruleset=📥 网盘下载,[]DOMAIN-SUFFIX,pixeldrain.com

; 🎬 核心媒体流大带宽直出加速 (99% YouTube/Twitch视频分片走 Cloudflare 千兆直连)
ruleset=🔗 直连节点,[]DOMAIN-SUFFIX,googlevideo.com
ruleset=🔗 直连节点,[]DOMAIN-SUFFIX,ttvnw.net
ruleset=🔗 直连节点,[]DOMAIN-SUFFIX,jtvnw.net
ruleset=🔗 直连节点,[]DOMAIN-SUFFIX,hembed.com
ruleset=🔗 直连节点,[]DOMAIN-SUFFIX,vdownload.hembed.com
ruleset=🎬 国外媒体,[]DOMAIN-SUFFIX,googletagmanager.com
ruleset=⚡ 自动选择,[]DOMAIN-SUFFIX,ooklaserver.net
ruleset=⚡ 自动选择,[]DOMAIN-KEYWORD,speedtest

; ② 广告拦截
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyListChina.list

; ③ 🤖 AI 专线规则（Gemini / Claude / OpenAI 全域覆盖，杜绝属地穿透）
ruleset=🤖 AI 专线,[]DOMAIN-SUFFIX,googleapis.com
ruleset=🤖 AI 专线,[]DOMAIN-SUFFIX,googleusercontent.com
ruleset=🤖 AI 专线,[]DOMAIN,antigravity-unleash.goog
ruleset=🤖 AI 专线,[]DOMAIN-SUFFIX,run.app
ruleset=🤖 AI 专线,[]DOMAIN,browser.events.data.microsoft.com
ruleset=🤖 AI 专线,[]DOMAIN,open-vsx.org
ruleset=🤖 AI 专线,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Gemini.list
ruleset=🤖 AI 专线,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list

; ④ 🌐 Google 完整生态加固 (彻底拯救 Google Play 下载 0 速度与 GMS 推送断流)
ruleset=⚡ 自动选择,[]DOMAIN,dl.google.com
ruleset=⚡ 自动选择,[]DOMAIN,dl.l.google.com
ruleset=⚡ 自动选择,[]DOMAIN,mtalk.google.com
ruleset=⚡ 自动选择,[]DOMAIN-SUFFIX,gvt1.com
ruleset=⚡ 自动选择,[]DOMAIN-SUFFIX,1e100.net
ruleset=⚡ 自动选择,[]DOMAIN-SUFFIX,google.com
ruleset=⚡ 自动选择,[]DOMAIN-SUFFIX,android.com
ruleset=⚡ 自动选择,[]DOMAIN-SUFFIX,onedrive.live.com
ruleset=⚡ 自动选择,[]DOMAIN-SUFFIX,livefilestore.com
ruleset=⚡ 自动选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Google.list

; ⑤ 常用海外专项服务
ruleset=🐙 GitHub,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Github.list
ruleset=🐙 GitHub,[]DOMAIN-SUFFIX,githubusercontent.com
ruleset=💬 社交软件,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Telegram.list

; 🎬 国外媒体 网页与控制面 (走稳定 SOCKS5 解决防风控与人机验证)
ruleset=🎬 国外媒体,[]DOMAIN-SUFFIX,rule34video.com
ruleset=🎬 国外媒体,[]DOMAIN-SUFFIX,hanime1.me
ruleset=🎬 国外媒体,[]DOMAIN-SUFFIX,twitch.tv
ruleset=🎬 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🎬 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/ProxyMedia.list

; ⑥ 下载规则兜底
ruleset=⚡ 自动选择,[]DOMAIN-KEYWORD,release
ruleset=📥 网盘下载,[]DOMAIN-KEYWORD,download
ruleset=📥 网盘下载,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list

; ⑦ 苹果与微软服务分流 (仅保留纯正不阻断的 Apple 直连，剔除易被墙的 OneDrive 直连)
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list

; ⑧ 纯正中国服务白名单与 IP 兜底 (彻底剔除含毒的 GoogleCN.list，实现零直连污染)
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIp.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; ------------------------------------------------------------
; 3. Subconverter 核心控制开关
; ------------------------------------------------------------
enable_rule_generator=true
overwrite_original_rules=true
