[custom]
; ============================================================
; Mihomo / Clash 进阶优化订阅转换规则 (基于 all (1).yaml 重构生成)
; 特性：Agent 低延迟专线 + Gemini 一致性哈希 + 全地区端口分流 + 媒体防误杀 + Fake-IP 0ms秒开
; ============================================================

; 去广告：支持
; 自动测速：支持 (300s / 180s 双轨测速)
; 微软分流：支持 (直连)
; 苹果分流：支持 (直连)
; 增强中国IP段：支持
; Agent / Gemini 专线：支持

; ------------------------------------------------------------
; 1. 策略组定义 (custom_proxy_group)
; 格式：组名`类型`[引用成员/前置策略]`匹配正则`[测速URL]`[间隔,容差,超时]
; ------------------------------------------------------------

; ① 主入口控制组
custom_proxy_group=🚀 节点选择`select`[]⚡ 自动优选`[]🤖 Agent 专线`[]🤖 Gemini 专项`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇩🇪 德国节点`[]♻️ 负载均衡`[]🔯 故障转移`[]🌐 手动切换`[]DIRECT

; ② 自动测速全选组
custom_proxy_group=⚡ 自动优选`url-test`.*`http://cp.cloudflare.com/generate_204`300,50,50

; ③ Agent 专线：纯净美/新节点 + 180s 高频测速 + 保持低延迟
custom_proxy_group=🤖 Agent 专线`url-test`(?i)(🇸🇬|新加坡|SG|SIN|Singapore|🇺🇸|美国|US|USA|美西|美东|洛杉矶|旧金山|芝加哥|达拉斯|纽约|迈阿密|西雅图|休斯顿|圣何塞)`http://cp.cloudflare.com/generate_204`180,30,30

; ④ Gemini 专属：纯净美/新节点 + 一致性哈希 (防止 IP 漂移封号)
custom_proxy_group=🤖 Gemini 专项`load-balance`(?i)(🇺🇸|美国|US|USA|美西|美东|洛杉矶|旧金山|芝加哥|达拉斯|纽约|迈阿密|西雅图|休斯顿|圣何塞|🇸🇬|新加坡|SG|SIN|Singapore)`http://cp.cloudflare.com/generate_204`300,,consistent-hashing

; ⑤ 业务分流组（下载专线优先自动优选，彻底杜绝外网分片走 DIRECT 直连）
custom_proxy_group=📥 下载专线`select`[]⚡ 自动优选`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]DIRECT
custom_proxy_group=🎥 国外媒体`select`[]⚡ 自动优选`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇩🇪 德国节点`[]🚀 节点选择`[]DIRECT
custom_proxy_group=🛑 社交软件`select`[]⚡ 自动优选`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🚀 节点选择`[]DIRECT
custom_proxy_group=🐙 GitHub 服务`select`[]⚡ 自动优选`[]🇺🇸 美国节点`[]🇸🇬 新加坡节点`[]DIRECT
custom_proxy_group=🏛️ 甲骨文服务`select`(?i)(直出|纯净|Actions|直连).*`[]🚀 节点选择`[]⚡ 自动优选`[]DIRECT`.*

; ⑥ 国家优选组 (精确匹配地区三字码与中英文，兼顾优选 IP 命名)
custom_proxy_group=🇸🇬 新加坡节点`url-test`(?i)(🇸🇬|新加坡|SG|SIN|Singapore)`http://cp.cloudflare.com/generate_204`300,50,50
custom_proxy_group=🇺🇸 美国节点`url-test`(?i)(🇺🇸|美国|US|USA|美西|美东|洛杉矶|旧金山|芝加哥|达拉斯|纽约|迈阿密|西雅图|休斯顿|圣何塞)`http://cp.cloudflare.com/generate_204`300,50,50
custom_proxy_group=🇩🇪 德国节点`url-test`(?i)(🇩🇪|德国|DE|法兰克福|Frankfurt|Berlin|Munich|München|Düsseldorf)`http://cp.cloudflare.com/generate_204`300,50,50

; ⑦ 容灾备用与基础控制
custom_proxy_group=♻️ 负载均衡`load-balance`.*`http://cp.cloudflare.com/generate_204`300,,consistent-hashing
custom_proxy_group=🔯 故障转移`fallback`.*`http://cp.cloudflare.com/generate_204`300
custom_proxy_group=🌐 手动切换`select`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]⚡ 自动优选`[]🎯 全球直连

; ------------------------------------------------------------
; 2. 规则集定义 (ruleset)
; 严格遵循从上至下优先级匹配：直连白名单 -> 媒体放行 -> 广告拦截 -> Agent/专项 -> 境外分流 -> 国内直连 -> 漏网之鱼
; ------------------------------------------------------------

; ① 局域网与基础直连放行
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list

; 🏛️ 甲骨文服务专属分流 (高优先级匹配，走纯净直出或代理，秒开甲骨文官网与控制台)
ruleset=🏛️ 甲骨文服务,[]DOMAIN-SUFFIX,oracle.com
ruleset=🏛️ 甲骨文服务,[]DOMAIN-SUFFIX,oraclecloud.com
ruleset=🏛️ 甲骨文服务,[]DOMAIN-SUFFIX,oraclecloud.net
ruleset=🏛️ 甲骨文服务,[]DOMAIN-SUFFIX,oraclefoundation.org
ruleset=🏛️ 甲骨文服务,[]DOMAIN-KEYWORD,oracle

; ② 核心视频/测速静态 CDN 强行走代理（优先放行，彻底杜绝广告拦截规则误伤）
ruleset=🎥 国外媒体,[]DOMAIN-SUFFIX,hembed.com
ruleset=🎥 国外媒体,[]DOMAIN-SUFFIX,vdownload.hembed.com
ruleset=🎥 国外媒体,[]DOMAIN-SUFFIX,googletagmanager.com
ruleset=⚡ 自动优选,[]DOMAIN-SUFFIX,ooklaserver.net
ruleset=⚡ 自动优选,[]DOMAIN-KEYWORD,speedtest

; ③ 广告拦截与应用净化
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyListChina.list

; ④ Agent 专线专属规则（高优先级，避免被 Google 通用规则拦截）
ruleset=🤖 Agent 专线,[]DOMAIN-SUFFIX,googleapis.com
ruleset=🤖 Agent 专线,[]DOMAIN-SUFFIX,googleusercontent.com
ruleset=🤖 Agent 专线,[]DOMAIN,antigravity-unleash.goog
ruleset=🤖 Agent 专线,[]DOMAIN-SUFFIX,run.app
ruleset=🤖 Agent 专线,[]DOMAIN,browser.events.data.microsoft.com
ruleset=🤖 Agent 专线,[]DOMAIN,open-vsx.org

; ⑤ Gemini 专项规则
ruleset=🤖 Gemini 专项,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Gemini.list

; ⑥ 常用海外专项服务
ruleset=🐙 GitHub 服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Github.list
ruleset=🛑 社交软件,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Telegram.list
ruleset=🎥 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/ProxyMedia.list

; ⑦ 系统级与海外下载加速
ruleset=🐙 GitHub 服务,[]DOMAIN-SUFFIX,githubusercontent.com
ruleset=⚡ 自动优选,[]DOMAIN-KEYWORD,release
ruleset=📥 下载专线,[]DOMAIN-KEYWORD,download
ruleset=📥 下载专线,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list

; ⑧ 国内直连服务
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIp.list

; ⑨ 苹果与微软服务直连
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/OneDrive.list

; ⑩ GEOIP 国内直连与漏网之鱼兜底
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; ------------------------------------------------------------
; 3. Subconverter 核心控制开关
; ------------------------------------------------------------
enable_rule_generator=true
overwrite_original_rules=true
