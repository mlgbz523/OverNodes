name: cf-overscan-gitee
displayName: Cloudflare 节点自动测速与同步

triggers:
  schedule:
    # 每天凌晨 4 点运行一次 (UTC 20:00)
    - cron: '0 20 * * *'
  push:
    branches:
      - main
      - master

stages:
  - name: 节点测速与同步
    displayName: 测速优选与订阅更新
    steps:
      - step: execute@shell
        name: 执行测速脚本
        image: python:3.10
        inputs:
          docker:
            image: python:3.10
        script:
          - python -m pip install --upgrade pip
          - pip install aiohttp
          # 使用专属于你的业务域名进行探针测速，优选 50 个高可用节点
          - python src/cf_overscan.py --limit 50 --domain 98k2887114514.28870721.xyz
          # 配置 git 提交信息
          - git config user.name "Gitee-Bot"
          - git config user.email "bot@gitee.com"
          - git add overNode*.txt ips_cfOverScan*.txt
          - git commit -m "Auto: Gitee 定时更新优选节点 [skip ci]" || echo "无新节点变更"
          - git push origin HEAD:main || echo "推送完成"
